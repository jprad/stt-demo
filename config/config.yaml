# STT Demo Configuration File
# Switch between different STT models by changing the 'active_model' value

# Active model to use (options: faster_whisper, nemo_canary, wav2vec2)
active_model: faster_whisper

# Default input mode (options: microphone, file)
default_input_mode: microphone

# Model configurations
models:
  faster_whisper:
    # Model size: tiny, base, small, medium, large-v2, large-v3
    model_size: base
    # Device: cuda, cpu, auto
    device: cuda
    # Compute type: float16, int8, int8_float16
    compute_type: int8
    # Language (leave empty for auto-detection)
    language: en
    # Beam size for decoding
    beam_size: 5
    # Number of CPU threads
    cpu_threads: 4

  nemo_canary:
    # Model name: nvidia/canary-1b (recommended for 8GB GPU)
    model_name: nvidia/canary-1b
    device: cuda
    # Source language code (en, es, fr, de, etc.)
    language: en
    # Task: asr (transcription) or ast (translation to English)
    task: asr
    # Punctuation and capitalization: yes or no
    pnc: yes

  wav2vec2:
    # Model options:
    # - facebook/wav2vec2-base-960h (smaller, faster)
    # - facebook/wav2vec2-large-960h (better quality)
    # - facebook/wav2vec2-large-960h-lv60-self (best quality, recommended)
    model_name: facebook/wav2vec2-large-960h-lv60-self
    device: cuda
    # Chunk length for processing long audio (seconds)
    chunk_length_s: 30

# Audio input settings
audio:
  # Sample rate for recording (Hz)
  sample_rate: 16000
  # Chunk duration for real-time processing (seconds)
  chunk_duration: 2.0
  # Audio format for file input
  supported_formats:
    - wav
    - mp3
    - flac
    - ogg
    - m4a

# Output settings
output:
  # Show timestamps in transcription
  show_timestamps: true
  # Show confidence scores (if available)
  show_confidence: false
  # Save transcription to file
  save_to_file: false
  # Output directory for saved transcriptions
  output_dir: ./transcriptions

# Performance settings
performance:
  # Enable VAD (Voice Activity Detection) to skip silence
  enable_vad: true
  # VAD threshold (0.0 to 1.0)
  vad_threshold: 0.5
